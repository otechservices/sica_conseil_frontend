<div class="min-h-screen bg-gradient-to-br from-orange-50 to-amber-50 dark:from-gray-900 dark:to-gray-800 flex items-center justify-center p-4 transition-colors">
  <div class="w-full max-w-md">
    <!-- Logo et titre -->
    <div class="text-center mb-8">
      <div class="flex justify-between items-center mb-4">
        <div class="flex-1"></div>
        <div class="inline-flex items-center justify-center">
          <img
            src="https://static.readdy.ai/image/2ce43ce334b232046883f79f4f3df46a/b61b027bf4d42918b4ae2ae5a241e2c2.jfif"
            alt="SICA CONSEIL"
            class="h-16 w-auto"
          />
        </div>
        <div class="flex-1 flex justify-end">
          <app-theme-toggle></app-theme-toggle>
        </div>
      </div>
      <h1 class="text-2xl font-bold text-gray-900 dark:text-white mb-2 transition-colors">Connexion</h1>
      <p class="text-gray-600 dark:text-gray-300 transition-colors">Accédez gratuitement à votre espace SICA CONSEIL</p>
    </div>

    <!-- Formulaire de connexion -->
    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-xl p-8 transition-colors">
      <form [formGroup]="loginForm" (ngSubmit)="handleSubmit()" class="space-y-6">
        <!-- Email -->
        <div>
          <label for="email" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2 transition-colors">
            Email
          </label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <i class="ri-mail-line text-gray-400 dark:text-gray-500"></i>
            </div>
            <input
              id="email"
              type="email"
              formControlName="email"
              class="block w-full pl-10 pr-3 py-3 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-transparent text-sm transition-colors"
              placeholder="votre@email.com"
            />
          </div>
        </div>

        <!-- Mot de passe -->
        <div>
          <label for="password" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2 transition-colors">
            Mot de passe
          </label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <i class="ri-lock-line text-gray-400 dark:text-gray-500"></i>
            </div>
            <input
              id="password"
              type="password"
              formControlName="password"
              class="block w-full pl-10 pr-3 py-3 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-transparent text-sm transition-colors"
              placeholder="••••••••"
            />
          </div>
        </div>

        <!-- Options -->
        <div class="flex items-center justify-between">
          <div class="flex items-center">
            <input
              id="remember-me"
              type="checkbox"
              formControlName="rememberMe"
              class="h-4 w-4 text-orange-500 focus:ring-orange-500 border-gray-300 dark:border-gray-600 dark:bg-gray-700 rounded cursor-pointer"
            />
            <label for="remember-me" class="ml-2 block text-sm text-gray-700 dark:text-gray-300 cursor-pointer transition-colors">
              Se souvenir de moi
            </label>
          </div>
          <a
            [routerLink]="['/forgot-password']"
            class="text-sm text-orange-500 hover:text-orange-600 font-medium"
          >
            Mot de passe oublié ?
          </a>
        </div>

        <!-- Bouton de connexion -->
        <button
          type="submit"
          [disabled]="loginForm.invalid"
          class="w-full bg-orange-500 text-white py-3 px-4 rounded-lg font-medium hover:bg-orange-600 focus:outline-none focus:ring-2 focus:ring-orange-500 focus:ring-offset-2 dark:focus:ring-offset-gray-800 transition-colors whitespace-nowrap cursor-pointer disabled:bg-gray-400 disabled:cursor-not-allowed"
        >
          Se connecter
        </button>
      </form>

      <!-- Lien d'inscription -->
      <div class="mt-6 text-center">
        <p class="text-gray-600 dark:text-gray-300 transition-colors">
          Pas encore de compte ?
          <a
            [routerLink]="['/register']"
            class="text-orange-500 hover:text-orange-600 font-medium"
          >
            S'inscrire maintenant
          </a>
        </p>
      </div>

      <!-- Divider -->
      <div class="mt-8 relative">
        <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-gray-300 dark:border-gray-600"></div></div>
        <div class="relative flex justify-center text-sm"><span class="px-2 bg-white dark:bg-gray-800 text-gray-500 dark:text-gray-400 transition-colors">ou continuer avec</span></div>
      </div>

      <!-- Connexion sociale -->
      <div class="mt-6 grid grid-cols-2 gap-3">
        <button class="w-full inline-flex justify-center py-2.5 px-4 border border-gray-300 dark:border-gray-600 rounded-lg shadow-sm bg-white dark:bg-gray-700 text-sm font-medium text-gray-500 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-orange-500 dark:focus:ring-offset-gray-800 cursor-pointer whitespace-nowrap transition-colors">
          <i class="ri-google-fill text-red-500 text-lg"></i><span class="ml-2">Google</span>
        </button>
        <button class="w-full inline-flex justify-center py-2.5 px-4 border border-gray-300 dark:border-gray-600 rounded-lg shadow-sm bg-white dark:bg-gray-700 text-sm font-medium text-gray-500 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-orange-500 dark:focus:ring-offset-gray-800 cursor-pointer whitespace-nowrap transition-colors">
          <i class="ri-linkedin-fill text-blue-600 text-lg"></i><span class="ml-2">LinkedIn</span>
        </button>
      </div>
    </div>

    <!-- Footer -->
    <div class="mt-8 text-center">
      <p class="text-xs text-gray-500 dark:text-gray-400 transition-colors">
        En vous connectant, vous acceptez nos
        <a [routerLink]="['/terms']" class="text-orange-500 hover:text-orange-600">Conditions d'utilisation</a>
        et notre
        <a [routerLink]="['/privacy']" class="text-orange-500 hover:text-orange-600">Politique de confidentialité</a>
      </p>
    </div>
  </div>
</div>
