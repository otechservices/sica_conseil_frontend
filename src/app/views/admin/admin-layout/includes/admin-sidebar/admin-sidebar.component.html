<aside class="w-64 bg-white dark:bg-gray-800 shadow-md flex flex-col">
  <div class="p-6 border-b border-gray-200 dark:border-gray-700">
    <span class="text-lg font-bold text-primary-600">Sica Admin</span>
  </div>
  <nav class="flex-1 p-4 space-y-1">
    <a *ngFor="let item of menu"
       [routerLink]="item.route"
       routerLinkActive="bg-primary-50 text-primary-600 dark:bg-primary-900/30 dark:text-primary-400"
       class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors cursor-pointer">
      <i class="text-lg" [ngClass]="item.icon"></i>
      <span class="text-sm font-medium">{{ item.label }}</span>
    </a>
  </nav>
</aside>
