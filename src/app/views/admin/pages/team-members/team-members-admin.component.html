<div class="space-y-6">
  <div class="flex items-center justify-between">
    <h2 class="text-2xl font-bold text-gray-800 dark:text-white">Équipe</h2>
    <button (click)="openCreate()" class="bg-primary-500 text-white px-4 py-2 rounded-lg hover:bg-primary-600 transition-colors flex items-center gap-2"><i class="ri-add-line"></i> Nouveau membre</button>
  </div>

  <div *ngIf="showForm" class="bg-white dark:bg-gray-800 rounded-xl p-6 shadow border border-gray-200 dark:border-gray-700 space-y-4">
    <h3 class="text-lg font-bold text-gray-800 dark:text-white">{{ editing ? 'Modifier' : 'Ajouter' }} un membre</h3>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div><label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Nom *</label><input [(ngModel)]="form.name" class="w-full border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg px-3 py-2 text-sm" /></div>
      <div><label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Titre / Poste *</label><input [(ngModel)]="form.title" class="w-full border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg px-3 py-2 text-sm" /></div>
      <div><label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Photo (URL)</label><input [(ngModel)]="form.photo" class="w-full border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg px-3 py-2 text-sm" /></div>
      <div><label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">LinkedIn</label><input [(ngModel)]="form.linkedin" class="w-full border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg px-3 py-2 text-sm" /></div>
      <div><label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Certifications (séparées par virgule)</label><input [(ngModel)]="form.certifications" class="w-full border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg px-3 py-2 text-sm" placeholder="PMP, PRINCE2, PSM" /></div>
      <div><label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Ordre</label><input type="number" [(ngModel)]="form.order" class="w-full border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg px-3 py-2 text-sm" /></div>
      <div class="flex items-center gap-3 pt-5"><label class="text-sm font-medium text-gray-700 dark:text-gray-300">Visible</label><input type="checkbox" [(ngModel)]="form.is_active" class="w-4 h-4 accent-primary-500" /></div>
    </div>
    <div><label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Bio</label><textarea [(ngModel)]="form.bio" rows="3" class="w-full border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg px-3 py-2 text-sm resize-none"></textarea></div>
    <div class="flex gap-3">
      <button (click)="submit()" class="bg-primary-500 text-white px-6 py-2 rounded-lg hover:bg-primary-600 transition-colors text-sm">Enregistrer</button>
      <button (click)="showForm = false" class="border border-gray-300 dark:border-gray-600 text-gray-600 dark:text-gray-300 px-6 py-2 rounded-lg text-sm">Annuler</button>
    </div>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
    <div *ngFor="let m of members" class="bg-white dark:bg-gray-800 rounded-xl p-5 shadow border border-gray-200 dark:border-gray-700">
      <div class="flex items-center gap-3 mb-3">
        <img *ngIf="m.photo" [src]="m.photo" class="w-12 h-12 rounded-full object-cover" />
        <div *ngIf="!m.photo" class="w-12 h-12 rounded-full bg-primary-100 flex items-center justify-center"><i class="ri-user-line text-primary-500 text-xl"></i></div>
        <div>
          <div class="font-bold text-gray-800 dark:text-white">{{ m.name }}</div>
          <div class="text-sm text-primary-500">{{ m.title }}</div>
        </div>
      </div>
      <p *ngIf="m.bio" class="text-gray-600 dark:text-gray-300 text-sm mb-3 line-clamp-2">{{ m.bio }}</p>
      <div *ngIf="m.certifications?.length" class="flex flex-wrap gap-1 mb-3">
        <span *ngFor="let c of m.certifications" class="text-xs bg-primary-100 dark:bg-primary-900/30 text-primary-600 px-2 py-0.5 rounded">{{ c }}</span>
      </div>
      <div class="flex justify-between items-center">
        <span class="px-2 py-0.5 rounded-full text-xs" [ngClass]="m.is_active ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-600'">{{ m.is_active ? 'Visible' : 'Masqué' }}</span>
        <div class="flex gap-1">
          <button (click)="openEdit(m)" class="text-blue-500 hover:text-blue-700 p-1"><i class="ri-edit-line"></i></button>
          <button (click)="toggle(m)" class="p-1" [ngClass]="m.is_active ? 'text-yellow-500' : 'text-green-500'"><i [ngClass]="m.is_active ? 'ri-eye-off-line' : 'ri-eye-line'"></i></button>
          <button (click)="delete(m)" class="text-red-500 hover:text-red-700 p-1"><i class="ri-delete-bin-line"></i></button>
        </div>
      </div>
    </div>
    <div *ngIf="members.length === 0 && !loading" class="col-span-3 text-center py-12 text-gray-400">Aucun membre d'équipe.</div>
  </div>
</div>
