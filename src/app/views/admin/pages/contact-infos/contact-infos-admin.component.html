<div class="space-y-6">
  <div class="flex items-center justify-between">
    <h2 class="text-2xl font-bold text-gray-800 dark:text-white">Informations de contact</h2>
    <button (click)="openCreate()" class="bg-primary-500 text-white px-4 py-2 rounded-lg hover:bg-primary-600 transition-colors flex items-center gap-2"><i class="ri-add-line"></i> Nouveau</button>
  </div>

  <div *ngIf="showForm" class="bg-white dark:bg-gray-800 rounded-xl p-6 shadow border border-gray-200 dark:border-gray-700 space-y-4">
    <h3 class="text-lg font-bold text-gray-800 dark:text-white">{{ editing ? 'Modifier' : 'Ajouter' }} une information</h3>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div><label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Type</label>
        <select [(ngModel)]="form.type" class="w-full border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg px-3 py-2 text-sm">
          <option *ngFor="let t of types" [value]="t">{{ t }}</option>
        </select>
      </div>
      <div><label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Label *</label><input [(ngModel)]="form.label" class="w-full border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg px-3 py-2 text-sm" /></div>
      <div><label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Valeur *</label><input [(ngModel)]="form.value" class="w-full border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg px-3 py-2 text-sm" /></div>
      <div><label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Icône (Remix Icon)</label><input [(ngModel)]="form.icon" class="w-full border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg px-3 py-2 text-sm" /></div>
      <div><label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Description</label><input [(ngModel)]="form.description" class="w-full border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg px-3 py-2 text-sm" /></div>
      <div><label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Ordre</label><input type="number" [(ngModel)]="form.order" class="w-full border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg px-3 py-2 text-sm" /></div>
      <div class="flex items-center gap-3 pt-5"><label class="text-sm font-medium text-gray-700 dark:text-gray-300">Visible</label><input type="checkbox" [(ngModel)]="form.is_active" class="w-4 h-4 accent-primary-500" /></div>
    </div>
    <div class="flex gap-3">
      <button (click)="submit()" class="bg-primary-500 text-white px-6 py-2 rounded-lg hover:bg-primary-600 transition-colors text-sm">Enregistrer</button>
      <button (click)="showForm = false" class="border border-gray-300 dark:border-gray-600 text-gray-600 dark:text-gray-300 px-6 py-2 rounded-lg text-sm">Annuler</button>
    </div>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
    <div *ngFor="let i of infos" class="bg-white dark:bg-gray-800 rounded-xl p-5 shadow border border-gray-200 dark:border-gray-700">
      <div class="flex items-center gap-3 mb-3">
        <div class="w-10 h-10 bg-primary-100 dark:bg-primary-900/30 rounded-full flex items-center justify-center"><i class="text-primary-500 text-lg" [ngClass]="i.icon"></i></div>
        <div>
          <div class="font-semibold text-gray-800 dark:text-white text-sm">{{ i.label }}</div>
          <div class="text-xs text-gray-500 dark:text-gray-400">{{ i.type }}</div>
        </div>
      </div>
      <p class="text-gray-700 dark:text-gray-300 text-sm font-medium mb-1">{{ i.value }}</p>
      <p *ngIf="i.description" class="text-gray-500 dark:text-gray-400 text-xs mb-3">{{ i.description }}</p>
      <div class="flex justify-between items-center">
        <span class="px-2 py-0.5 rounded-full text-xs" [ngClass]="i.is_active ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-600'">{{ i.is_active ? 'Visible' : 'Masqué' }}</span>
        <div class="flex gap-1">
          <button (click)="openEdit(i)" class="text-blue-500 hover:text-blue-700 p-1"><i class="ri-edit-line"></i></button>
          <button (click)="toggle(i)" class="p-1" [ngClass]="i.is_active ? 'text-yellow-500' : 'text-green-500'"><i [ngClass]="i.is_active ? 'ri-eye-off-line' : 'ri-eye-line'"></i></button>
          <button (click)="delete(i)" class="text-red-500 hover:text-red-700 p-1"><i class="ri-delete-bin-line"></i></button>
        </div>
      </div>
    </div>
    <div *ngIf="infos.length === 0 && !loading" class="col-span-4 text-center py-12 text-gray-400">Aucune information de contact.</div>
  </div>
</div>
