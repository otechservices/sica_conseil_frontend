<div class="space-y-6">
  <div class="flex items-center justify-between">
    <h2 class="text-2xl font-bold text-gray-800 dark:text-white">Formations</h2>
    <button (click)="openCreate()" class="bg-primary-500 text-white px-4 py-2 rounded-lg hover:bg-primary-600 transition-colors flex items-center gap-2">
      <i class="ri-add-line"></i> Nouvelle formation
    </button>
  </div>

  <!-- Formulaire -->
  <div *ngIf="showForm" class="bg-white dark:bg-gray-800 rounded-xl p-6 shadow border border-gray-200 dark:border-gray-700 space-y-4">
    <h3 class="text-lg font-bold text-gray-800 dark:text-white">{{ editing ? 'Modifier' : 'Créer' }} une formation</h3>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div><label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Titre *</label><input [(ngModel)]="form.title" class="w-full border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg px-3 py-2 text-sm" /></div>
      <div><label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Catégorie *</label><input [(ngModel)]="form.category" class="w-full border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg px-3 py-2 text-sm" /></div>
      <div><label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Niveau</label><input [(ngModel)]="form.level" class="w-full border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg px-3 py-2 text-sm" /></div>
      <div><label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Durée</label><input [(ngModel)]="form.duration" class="w-full border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg px-3 py-2 text-sm" /></div>
      <div><label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Prix</label><input [(ngModel)]="form.price" class="w-full border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg px-3 py-2 text-sm" /></div>
      <div><label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Prix original</label><input [(ngModel)]="form.original_price" class="w-full border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg px-3 py-2 text-sm" /></div>
      <div><label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Instructeur</label><input [(ngModel)]="form.instructor" class="w-full border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg px-3 py-2 text-sm" /></div>
      <div><label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Badge</label><input [(ngModel)]="form.badge" class="w-full border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg px-3 py-2 text-sm" /></div>
      <div><label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Note (0-5)</label><input type="number" min="0" max="5" step="0.1" [(ngModel)]="form.rating" class="w-full border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg px-3 py-2 text-sm" /></div>
      <div><label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Étudiants</label><input type="number" [(ngModel)]="form.students" class="w-full border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg px-3 py-2 text-sm" /></div>
      <div><label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Ordre</label><input type="number" [(ngModel)]="form.order" class="w-full border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg px-3 py-2 text-sm" /></div>
      <div class="flex items-center gap-3 pt-5"><label class="text-sm font-medium text-gray-700 dark:text-gray-300">Active</label><input type="checkbox" [(ngModel)]="form.is_active" class="w-4 h-4 accent-primary-500" /></div>
    </div>
    <div><label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">URL Image</label><input [(ngModel)]="form.image_url" class="w-full border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg px-3 py-2 text-sm" /></div>
    <div><label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Description</label><textarea [(ngModel)]="form.description" rows="3" class="w-full border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg px-3 py-2 text-sm resize-none"></textarea></div>
    <div><label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Points clés (un par ligne)</label><textarea [(ngModel)]="form.features" rows="4" class="w-full border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg px-3 py-2 text-sm resize-none"></textarea></div>
    <div class="flex gap-3">
      <button (click)="submit()" class="bg-primary-500 text-white px-6 py-2 rounded-lg hover:bg-primary-600 transition-colors text-sm">Enregistrer</button>
      <button (click)="showForm = false" class="border border-gray-300 dark:border-gray-600 text-gray-600 dark:text-gray-300 px-6 py-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors text-sm">Annuler</button>
    </div>
  </div>

  <!-- Table -->
  <div class="bg-white dark:bg-gray-800 rounded-xl shadow border border-gray-200 dark:border-gray-700 overflow-hidden">
    <div *ngIf="loading" class="p-12 text-center text-gray-500 dark:text-gray-400"><i class="ri-loader-4-line animate-spin text-2xl"></i></div>
    <table *ngIf="!loading" class="w-full text-sm">
      <thead class="bg-gray-50 dark:bg-gray-700 text-gray-600 dark:text-gray-300 text-xs uppercase">
        <tr>
          <th class="px-4 py-3 text-left">Titre</th>
          <th class="px-4 py-3 text-left">Catégorie</th>
          <th class="px-4 py-3 text-left">Prix</th>
          <th class="px-4 py-3 text-left">Note</th>
          <th class="px-4 py-3 text-center">Statut</th>
          <th class="px-4 py-3 text-center">Actions</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-gray-100 dark:divide-gray-700">
        <tr *ngFor="let f of formations" class="hover:bg-gray-50 dark:hover:bg-gray-750 transition-colors">
          <td class="px-4 py-3 font-medium text-gray-800 dark:text-white max-w-xs truncate">{{ f.title }}</td>
          <td class="px-4 py-3 text-gray-600 dark:text-gray-300">{{ f.category }}</td>
          <td class="px-4 py-3 text-primary-500 font-semibold">{{ f.price }}</td>
          <td class="px-4 py-3 text-gray-600 dark:text-gray-300">⭐ {{ f.rating }}</td>
          <td class="px-4 py-3 text-center">
            <span class="px-2 py-1 rounded-full text-xs font-medium" [ngClass]="f.is_active ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-600'">
              {{ f.is_active ? 'Active' : 'Inactive' }}
            </span>
          </td>
          <td class="px-4 py-3 text-center space-x-2">
            <button (click)="openEdit(f)" class="text-blue-500 hover:text-blue-700 p-1"><i class="ri-edit-line"></i></button>
            <button (click)="toggle(f)" class="p-1" [ngClass]="f.is_active ? 'text-yellow-500 hover:text-yellow-700' : 'text-green-500 hover:text-green-700'">
              <i [ngClass]="f.is_active ? 'ri-eye-off-line' : 'ri-eye-line'"></i>
            </button>
            <button (click)="delete(f)" class="text-red-500 hover:text-red-700 p-1"><i class="ri-delete-bin-line"></i></button>
          </td>
        </tr>
        <tr *ngIf="formations.length === 0">
          <td colspan="6" class="px-4 py-12 text-center text-gray-400 dark:text-gray-500">Aucune formation. Créez-en une.</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
