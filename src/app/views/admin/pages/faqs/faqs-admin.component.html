<div class="space-y-6">
  <div class="flex items-center justify-between">
    <h2 class="text-2xl font-bold text-gray-800 dark:text-white">FAQs</h2>
    <button (click)="openCreate()" class="bg-primary-500 text-white px-4 py-2 rounded-lg hover:bg-primary-600 transition-colors flex items-center gap-2"><i class="ri-add-line"></i> Nouvelle FAQ</button>
  </div>

  <div *ngIf="showForm" class="bg-white dark:bg-gray-800 rounded-xl p-6 shadow border border-gray-200 dark:border-gray-700 space-y-4">
    <h3 class="text-lg font-bold text-gray-800 dark:text-white">{{ editing ? 'Modifier' : 'Créer' }} une FAQ</h3>
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div><label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Page</label>
        <select [(ngModel)]="form.page" class="w-full border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg px-3 py-2 text-sm">
          <option *ngFor="let p of pages" [value]="p">{{ p }}</option>
        </select>
      </div>
      <div><label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Ordre</label><input type="number" [(ngModel)]="form.order" class="w-full border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg px-3 py-2 text-sm" /></div>
      <div class="flex items-center gap-3 pt-5"><label class="text-sm font-medium text-gray-700 dark:text-gray-300">Visible</label><input type="checkbox" [(ngModel)]="form.is_active" class="w-4 h-4 accent-primary-500" /></div>
    </div>
    <div><label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Question *</label><input [(ngModel)]="form.question" class="w-full border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg px-3 py-2 text-sm" /></div>
    <div><label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Réponse *</label><textarea [(ngModel)]="form.answer" rows="4" class="w-full border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg px-3 py-2 text-sm resize-none"></textarea></div>
    <div class="flex gap-3">
      <button (click)="submit()" class="bg-primary-500 text-white px-6 py-2 rounded-lg hover:bg-primary-600 transition-colors text-sm">Enregistrer</button>
      <button (click)="showForm = false" class="border border-gray-300 dark:border-gray-600 text-gray-600 dark:text-gray-300 px-6 py-2 rounded-lg text-sm">Annuler</button>
    </div>
  </div>

  <div class="bg-white dark:bg-gray-800 rounded-xl shadow border border-gray-200 dark:border-gray-700 overflow-hidden">
    <div *ngIf="loading" class="p-12 text-center text-gray-500"><i class="ri-loader-4-line animate-spin text-2xl"></i></div>
    <table *ngIf="!loading" class="w-full text-sm">
      <thead class="bg-gray-50 dark:bg-gray-700 text-gray-600 dark:text-gray-300 text-xs uppercase">
        <tr>
          <th class="px-4 py-3 text-left">Question</th>
          <th class="px-4 py-3 text-left">Page</th>
          <th class="px-4 py-3 text-center">Statut</th>
          <th class="px-4 py-3 text-center">Actions</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-gray-100 dark:divide-gray-700">
        <tr *ngFor="let f of faqs" class="hover:bg-gray-50 dark:hover:bg-gray-750">
          <td class="px-4 py-3 text-gray-800 dark:text-white max-w-md">{{ f.question }}</td>
          <td class="px-4 py-3"><span class="bg-primary-100 text-primary-600 px-2 py-0.5 rounded text-xs">{{ f.page }}</span></td>
          <td class="px-4 py-3 text-center"><span class="px-2 py-1 rounded-full text-xs font-medium" [ngClass]="f.is_active ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-600'">{{ f.is_active ? 'Visible' : 'Masqué' }}</span></td>
          <td class="px-4 py-3 text-center space-x-2">
            <button (click)="openEdit(f)" class="text-blue-500 hover:text-blue-700 p-1"><i class="ri-edit-line"></i></button>
            <button (click)="toggle(f)" class="p-1" [ngClass]="f.is_active ? 'text-yellow-500' : 'text-green-500'"><i [ngClass]="f.is_active ? 'ri-eye-off-line' : 'ri-eye-line'"></i></button>
            <button (click)="delete(f)" class="text-red-500 hover:text-red-700 p-1"><i class="ri-delete-bin-line"></i></button>
          </td>
        </tr>
        <tr *ngIf="faqs.length === 0"><td colspan="4" class="px-4 py-12 text-center text-gray-400">Aucune FAQ.</td></tr>
      </tbody>
    </table>
  </div>
</div>
