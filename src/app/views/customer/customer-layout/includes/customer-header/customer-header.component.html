    <header class="bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 px-8 py-6 transition-colors">
      <div class="flex items-center justify-between">
        <div>
          <h1 class="text-2xl font-bold text-gray-800 dark:text-white transition-colors">Tableau de bord</h1>
          <p class="text-gray-600 dark:text-gray-300 mt-1 transition-colors">Votre plateforme complète pour la gestion de projet et la certification PMP</p>
        </div>
        <div class="flex items-center space-x-3">
          <app-theme-toggle></app-theme-toggle>
          <div class="relative" #dropdownWrapper>
              <!-- Bouton utilisateur -->
              <button (click)="toggleDropdown()" 
                      class="w-10 h-10 bg-gray-100 dark:bg-gray-700 rounded-full flex items-center justify-center 
                            hover:bg-gray-200 dark:hover:bg-gray-600 cursor-pointer transition-colors">
                  <i class="ri-user-line text-gray-600 dark:text-gray-300"></i>
              </button>

              <!-- Dropdown -->
              <div *ngIf="isOpen" class="absolute right-0 mt-2 w-48 bg-white dark:bg-gray-800 shadow-lg rounded-md z-50">
                <ul class="py-1">
                  <li>
                    <a (click)="logout()" 
                      class="block px-4 py-2 text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700 cursor-pointer">
                      Déconnexion
                    </a>
                  </li>
                </ul>
              </div>
            </div>


        </div>
      </div>
    </header>
